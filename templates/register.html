<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LexAI Legal Intelligence</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0c0f 0%, #1a1e24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-container {
            background: #1a1e24;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            border: 1px solid #2a2f36;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo i {
            font-size: 3rem;
            color: #c5a47a;
        }
        .logo h1 {
            font-family: 'Playfair Display', serif;
            color: #c5a47a;
            margin-top: 1rem;
        }
        .logo p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            color: #c5a47a;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #2a2f36;
            border: 1px solid #3a3f48;
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #c5a47a;
            box-shadow: 0 0 0 2px rgba(197, 164, 122, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: #c5a47a;
            color: #0a0c0f;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: #b08f67;
            transform: translateY(-1px);
        }
        .flash-message {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #ef4444;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .login-footer {
            margin-top: 2rem;
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .login-footer a {
            color: #c5a47a;
            text-decoration: none;
            font-weight: 600;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-scale-balanced"></i>
            <h1>LexAI</h1>
            <p>Create your secure Legal Intelligence account</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="/register">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="e.g., Sarah Jenkins" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="e.g., sarah@lawfirm.com" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="btn-login">Create Account</button>
        </form>
        
        <div class="login-footer">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
