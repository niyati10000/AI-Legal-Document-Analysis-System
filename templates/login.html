{% extends "base.html" %}

{% block title %}Login - LexAI Legal Intelligence{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px); padding: 1rem 0;">
    <div class="glass-panel" style="width: 100%; max-width: 440px; box-shadow: var(--glass-shadow);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; background: rgba(197, 164, 122, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; border: 1px solid var(--accent-gold);">
                <i class="fas fa-scale-balanced" style="font-size: 1.6rem; color: var(--accent-gold);"></i>
            </div>
            <h2 style="font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 0.3rem;">Welcome to LexAI</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to access your Legal Intelligence portal</p>
        </div>
        
        <form method="POST" action="/login">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="e.g., demo@lexai.com" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem; border-radius: var(--border-radius-sm);">
                Login to Portal
            </button>
        </form>
        
        <div class="glass-card" style="margin-top: 1.5rem; text-align: center; background: rgba(255,255,255,0.01); border: 1px dashed var(--glass-border); padding: 1rem;">
            <p style="color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; margin-bottom: 0.4rem;">
                <i class="fas fa-info-circle" style="color: var(--accent-gold);"></i> Demo Credentials
            </p>
            <p style="color: var(--accent-gold); font-size: 0.85rem; font-family: monospace;">Email: demo@lexai.com</p>
            <p style="color: var(--accent-gold); font-size: 0.85rem; font-family: monospace;">Password: demo123</p>
        </div>

        <div style="margin-top: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
            Don't have an account? <a href="/register" style="color: var(--accent-gold); text-decoration: none; font-weight: 600;">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
