{% extends "base.html" %}

{% block title %}Page Not Found - LexAI{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px);">
    <div class="glass-panel" style="width: 100%; max-width: 480px; text-align: center; padding: 3rem 2rem;">
        <div style="width: 60px; height: 60px; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <i class="fas fa-compass" style="font-size: 1.6rem; color: var(--accent-gold);"></i>
        </div>
        <h2 style="font-family: var(--font-heading); font-size: 2rem; margin-bottom: 0.5rem;">404 - Page Not Found</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6;">
            The URL path you requested does not exist or has been removed. Check the spelling or return home.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/dashboard" class="btn btn-secondary">Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
